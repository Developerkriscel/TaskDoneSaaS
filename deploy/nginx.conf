# ============================================================
# Nginx Configuration for TaskDoneSaaS
# Domain: taskeasyapp.in
# ============================================================
# Installation:
#   1. Copy to /etc/nginx/sites-available/taskdone
#   2. Symlink: ln -s /etc/nginx/sites-available/taskdone /etc/nginx/sites-enabled/
#   3. Test:   sudo nginx -t
#   4. Reload:  sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name taskeasyapp.in www.taskeasyapp.in;

    # Redirect all HTTP to HTTPS
    return 301 https://taskeasyapp.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name taskeasyapp.in www.taskeasyapp.in;

    # SSL will be configured by Certbot (see deployment steps)

    root /var/www/taskdone/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # ---- API REVERSE PROXY (to Node.js backend) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # For SSE/streaming (AI chat)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
    }

    # ---- HEALTH CHECK (direct backend access) ----
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- FRONTEND STATIC FILES ----
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets (but not index.html)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---- LEGACY TASK APP (iframe) ----
    location /taskapp-legacy.html {
        try_files $uri =404;
        expires 1h;
    }

    # ---- SECURITY HEADERS ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
